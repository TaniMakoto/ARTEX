name: Windows portable

on:
  workflow_dispatch:
  push:
    branches: [codex/portable-windows]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and verify portable PostgreSQL runtime
        run: python tools/package_portable_windows.py runtime --output "${{ runner.temp }}/postgres"
      - name: Include app-local Visual C++ runtime (no user installer)
        run: python tools/package_portable_windows.py crt --runtime "${{ runner.temp }}/postgres"
      - name: Test against a private database without installation
        run: go run ./tools/portablecheck --runtime "${{ runner.temp }}/postgres" --packages "./config,./db,./evidence,./internal/localpostgres,./server,./cmd/artex,./guard,./intercept,./llmpool,./llmrec,./mcphttp,./notify,./selfupdate,./sidequestion,./traffic"
      - name: Build static web interface
        working-directory: web
        env:
          NEXT_EXPORT: "1"
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Embed web interface
        run: |
          New-Item -ItemType Directory -Force server/webui/dist | Out-Null
          Copy-Item web/out/* server/webui/dist -Recurse
      - name: Build Windows executable
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -tags embedui -trimpath -ldflags "-s -w -X main.version=portable-${{ github.sha }}" -o dist/artex.exe ./cmd/artex
      - name: Create offline portable package
        run: python tools/package_portable_windows.py package --binary dist/artex.exe --runtime "${{ runner.temp }}/postgres" --output dist/artex-windows-amd64-portable.zip
      - name: Smoke test the packaged application
        run: python tools/smoke_portable_windows.py dist/artex-windows-amd64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: artex-windows-amd64-portable
          path: |
            dist/artex-windows-amd64-portable.zip
            dist/artex-windows-amd64-portable.zip.sha256
          if-no-files-found: error

  legacy-agent-regression:
    name: Legacy agent regression (known baseline failure)
    runs-on: windows-latest
    # TestGraphOverviewExpandsAssociatedCompanyScope also fails on unchanged
    # 2d8af60: coverage.scope is absent. Report the full agent suite separately
    # rather than suppressing that test or blocking the validated portable zip.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare verified runtime
        run: python tools/package_portable_windows.py runtime --output "${{ runner.temp }}/postgres"
      - name: Include app-local Visual C++ runtime
        run: python tools/package_portable_windows.py crt --runtime "${{ runner.temp }}/postgres"
      - name: Run full legacy agent suite
        run: go run ./tools/portablecheck --runtime "${{ runner.temp }}/postgres" --packages ./agent
